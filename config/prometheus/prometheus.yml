# Prometheus configuration for scraping our Java application
# This tells Prometheus where to find metrics and how often to collect them

global:
  # How frequently to scrape targets by default
  # 15s is a good balance between timeliness and resource usage
  scrape_interval: 15s
  
  # How long until a scrape request times out
  scrape_timeout: 10s
  
  # How frequently to evaluate recording and alerting rules
  evaluation_interval: 15s

# Rules for recording and alerting (we'll expand this later)
rule_files:
  # - "alert_rules.yml"

# Configuration for scraping targets
scrape_configs:
  # Scrape Prometheus itself to monitor the monitoring system
  - job_name: 'prometheus'
    static_configs:
      - targets: ['host.containers.internal:9090']
    scrape_interval: 30s  # Less frequent since Prometheus metrics change slowly
    
  # Scrape our Java application
  - job_name: 'java-app'
    static_configs:
      # This points to your Java app running on the host
      # 127.0.0.1 resolves to host IP from container
      - targets: ['host.containers.internal:8080']
    scrape_interval: 5s   # More frequent for our demo app
    scrape_timeout: 3s
    metrics_path: '/metrics'  # Default path where Prometheus client exposes metrics
    
    # Optional: Add static labels to all metrics from this job
    # Useful for identifying metrics source in multi-environment setups
    relabel_configs:
      - target_label: 'instance'
        replacement: 'java-demo-app'